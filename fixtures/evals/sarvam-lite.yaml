# Live agent tasks against the MCP server oryva generates from fixtures/specs/sarvam-lite.yaml,
# backed by the canned stub API in scripts/stub_sarvam.py. Run with scripts/live-eval.sh.
server:
  command: ${ORYVA_VENV}/bin/sarvam-mcp
  env:
    SARVAM_API_KEY: ${SARVAM_API_KEY:-stub}
    SARVAM_BASE_URL: ${SARVAM_BASE_URL}
max_turns: 8
tasks:
  - id: translate-hindi
    prompt: Translate "Good morning" into Hindi using the API.
    expect:
      tools_called: [text_translate]
      answer_contains: ["सुप्रभात"]
      max_tool_errors: 0
      max_tool_calls: 2
  - id: identify-language
    prompt: Use the API to find the language code of this text, and reply with just the code. "আমি ভাত খাই"
    expect:
      tools_called: [text_identify_language]
      answer_contains: ["bn-IN"]
      max_tool_errors: 0
      max_tool_calls: 2
  - id: delete-pronunciation
    prompt: Delete the custom pronunciation for the word "Sarvam". Leave every other pronunciation alone.
    expect:
      tools_called: [pronunciations_list, pronunciations_delete]
      max_tool_errors: 0
      max_tool_calls: 4
